<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cart — Tiffin Center</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>

<header class="tc-header" id="tc-header" data-active="cart" data-base=""></header>

<section class="section" style="padding-top:34px;">
  <div class="container">
    <div class="section-head">
      <div class="eyebrow">Your Order</div>
      <h2>Cart</h2>
      <p style="color:#8A7660;">Ordering from <strong data-table-display>No table selected</strong></p>
    </div>

    <div class="cart-layout">
      <div id="cart-items"></div>
      <div class="summary-card" id="cart-summary"></div>
    </div>
  </div>
</section>

<footer class="tc-footer" id="tc-footer"></footer>

<script src="js/app.js"></script>
<script src="js/menu.js"></script>
<script src="js/cart.js"></script>
</body>
</html>
