<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Checkout — Tiffin Center</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>

<header class="tc-header" id="tc-header" data-active="cart" data-base=""></header>

<section class="section" style="padding-top:34px;">
  <div class="container">
    <div class="section-head">
      <div class="eyebrow">Almost there</div>
      <h2>Checkout</h2>
    </div>

    <div class="cart-layout">
      <div class="form-card">
        <div class="field">
          <label>Table Number</label>
          <select data-table-select style="width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:10px;background:var(--cream-dim);font-weight:700;color:var(--green-deep);font-size:14.5px;">
            <option value="">Select Table</option>
          </select>
          <div style="font-size:11.5px;color:#8A7660;margin-top:6px;">
            <i class="fa-solid fa-circle-info"></i> Normally auto-filled by scanning the table's QR code — pick yours manually if needed.
          </div>
        </div>
        <form id="checkout-form">
          <div class="field">
            <label for="customer-name">Customer Name</label>
            <input type="text" id="customer-name" placeholder="e.g. Saran" autocomplete="name" required>
            <div class="field-error">Please enter your name.</div>
          </div>
          <div class="field">
            <label for="customer-mobile">Mobile Number</label>
            <input type="tel" id="customer-mobile" placeholder="e.g. 9876543210" maxlength="10" autocomplete="tel" required>
            <div class="field-error">Please enter a valid 10-digit mobile number.</div>
          </div>
          <button type="submit" class="btn btn-primary btn-block" id="place-order-btn">
            <i class="fa-solid fa-check"></i> Place Order
          </button>
        </form>
      </div>

      <div class="summary-card">
        <h3>Order Summary</h3>
        <div id="checkout-items"></div>
      </div>
    </div>
  </div>
</section>

<footer class="tc-footer" id="tc-footer"></footer>

<script src="js/app.js"></script>
<script src="js/menu.js"></script>
<script src="js/cart.js"></script>
<script src="js/checkout.js"></script>
</body>
</html>
