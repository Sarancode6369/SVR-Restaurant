<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Menu Management — Tiffin Center Admin</title>
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/admin.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
</head>
<body class="admin-body">

<div class="admin-shell">
  <aside class="admin-sidebar" data-admin-sidebar>
    <div class="admin-sidebar-brand"><span class="steam-mark"><span></span><span></span><span></span></span> Tiffin Admin</div>
    <nav class="admin-sidebar-nav">
      <a href="dashboard.html"><i class="fa-solid fa-gauge"></i> Dashboard</a>
      <a href="menu.html" class="active"><i class="fa-solid fa-utensils"></i> Menu Management</a>
      <a href="orders.html"><i class="fa-solid fa-receipt"></i> Orders</a>
      <a href="tables.html"><i class="fa-solid fa-chair"></i> Tables</a>
      <a href="qr-codes.html"><i class="fa-solid fa-qrcode"></i> QR Codes</a>
    </nav>
    <div class="admin-sidebar-foot">
      <a href="../index.html"><i class="fa-solid fa-arrow-left"></i> Back to Website</a>
    </div>
  </aside>

  <div class="admin-main">
    <header class="admin-topbar">
      <div>
        <button class="admin-mobile-toggle" data-admin-toggle aria-label="Toggle sidebar"><i class="fa-solid fa-bars"></i></button>
        <h1 style="display:inline;">Menu Management</h1>
        <div class="admin-topbar-sub">Add, edit, or remove food items</div>
      </div>
      <button class="btn btn-primary" id="add-item-btn"><i class="fa-solid fa-plus"></i> Add Food Item</button>
    </header>

    <div class="admin-content">
      <div class="admin-panel">
        <div class="filters-bar">
          <input type="search" id="menu-search-input" placeholder="Search food items...">
          <select id="menu-category-filter"></select>
        </div>
        <div class="data-table-wrap">
          <table class="data-table">
            <thead><tr><th>Image</th><th>Name</th><th>Category</th><th>Price</th><th>Status</th><th>Actions</th></tr></thead>
            <tbody id="menu-table-body"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Add / Edit Modal -->
<div class="tc-modal-overlay" id="menu-modal">
  <div class="tc-modal">
    <div class="tc-modal-head">
      <h3 id="menu-modal-title">Add Food Item</h3>
      <button class="tc-modal-close" id="menu-modal-close" aria-label="Close"><i class="fa-solid fa-xmark"></i></button>
    </div>
    <form id="menu-item-form">
      <div class="field">
        <label for="item-name">Name *</label>
        <input type="text" id="item-name" required>
      </div>
      <div class="grid-2">
        <div class="field">
          <label for="item-category">Category *</label>
          <input type="text" id="item-category" list="category-suggestions" required>
          <datalist id="category-suggestions">
            <option value="Breakfast"><option value="Dosa"><option value="Idli">
            <option value="Vada"><option value="Poori"><option value="Rice"><option value="Beverages">
          </datalist>
        </div>
        <div class="field">
          <label for="item-price">Price (₹) *</label>
          <input type="number" id="item-price" min="1" step="0.01" required>
        </div>
      </div>
      <div class="field">
        <label for="item-description">Description</label>
        <textarea id="item-description" rows="2"></textarea>
      </div>
      <div class="field">
        <label for="item-image">Image URL</label>
        <input type="url" id="item-image" placeholder="https://...">
      </div>
      <div class="field" style="display:flex;align-items:center;gap:10px;">
        <input type="checkbox" id="item-available" style="width:auto;" checked>
        <label for="item-available" style="margin:0;">Available for ordering</label>
      </div>
      <button type="submit" class="btn btn-primary btn-block"><i class="fa-solid fa-check"></i> Save Item</button>
    </form>
  </div>
</div>

<script src="../js/app.js"></script>
<script src="../js/menu.js"></script>
<script src="../js/admin.js"></script>
<script>
  document.addEventListener("DOMContentLoaded", () => {
    tcPopulateCategoryFilter();
    tcRenderMenuTable();

    document.getElementById("add-item-btn").addEventListener("click", () => tcOpenMenuModal());
    document.getElementById("menu-modal-close").addEventListener("click", () => tcModalClose("menu-modal"));
    document.getElementById("menu-modal").addEventListener("click", (e) => {
      if (e.target.id === "menu-modal") tcModalClose("menu-modal");
    });
    document.getElementById("menu-item-form").addEventListener("submit", tcSaveMenuItem);
    document.getElementById("menu-search-input").addEventListener("input", tcRenderMenuTable);
    document.getElementById("menu-category-filter").addEventListener("change", tcRenderMenuTable);
  });
</script>
</body>
</html>
